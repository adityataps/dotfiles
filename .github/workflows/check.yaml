name: Check dotfiles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install check tools
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install shellcheck
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck zsh
          fi
      - name: Check Bash and Zsh syntax
        run: |
          for script in *.sh; do /bin/bash -n "$script"; done
          zsh -n dotfiles/.zshrc
          shellcheck -x *.sh
      - name: Run isolated regression tests
        run: python3 -m unittest discover -s tests -v
